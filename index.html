<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05070d" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 L5 11 h3 L3.5 17 h17 L16 11 h3 Z' fill='%23ffcf5c'/%3E%3Cpath d='M12 17 v4' stroke='%238b5a2b' stroke-width='2'/%3E%3C/svg%3E" />
<title>手势控制圣诞树</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- 圣诞树主画布 -->
<canvas id="treeCanvas" aria-label="圣诞树交互区域"></canvas>

<!-- 顶部栏 -->
<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 L5 11 h3 L3.5 17 h17 L16 11 h3 Z"/>
        <path d="M12 17 v4"/>
        <path d="M9 21 h6"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1>手势控制圣诞树</h1>
      <p>隔空操控 · 点击换色 · 手机电脑通用</p>
    </div>
  </div>
  <div class="pills">
    <span id="cameraPill" class="pill pill-off"><i class="dot"></i><span>摄像头未开启</span></span>
    <span id="colorPill" class="pill pill-default"><i class="dot"></i><span>默认配色</span></span>
  </div>
</header>

<!-- 换色提示 -->
<div class="tap-hint" id="tapHint">
  <span class="tap-ring"></span>
  <span class="hint-full">点击 / 点按圣诞树换色：默认 → 蓝 → 深绿 → 淡粉</span>
  <span class="hint-short">点击换色</span>
</div>

<!-- 控制面板 -->
<aside class="panel" id="controlPanel">
  <button class="cam-btn" id="camBtn" type="button">
    <span class="cam-btn-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3z"/>
      </svg>
    </span>
    <span id="camBtnText">开启摄像头手势控制</span>
  </button>

  <button class="fx-btn" id="fxBtn" type="button">
    <span class="fx-btn-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/>
      </svg>
    </span>
    <span id="fxBtnText">开启流星烟花</span>
  </button>

  <div class="guide">
    <div class="guide-title">隔空操控手势</div>
    <div class="guide-row"><b>张开手掌</b><span>粒子展开</span></div>
    <div class="guide-row"><b>握紧拳头</b><span>粒子聚拢</span></div>
    <div class="guide-row"><b>左右移手</b><span>旋转圣诞树</span></div>
    <div class="guide-row"><b>上下移手</b><span>缩放树体</span></div>
    <div class="guide-row"><b>捏合手指</b><span>打开礼物 · 看祝福</span></div>
  </div>

  <div class="gesture-live" id="gestureLive">手势状态：未检测</div>
</aside>

<!-- 摄像头预览（含骨架叠加层） -->
<div class="cam-panel hidden" id="camPanel">
  <video id="camVideo" playsinline autoplay muted></video>
  <canvas id="camOverlay"></canvas>
  <div class="cam-tag">CAMERA LIVE</div>
  <button class="cam-close" id="camClose" type="button" aria-label="关闭摄像头">×</button>
</div>

<!-- 异常/授权提示 -->
<div class="alert-box hidden" id="alertBox" role="alert">
  <div class="alert-ico">!</div>
  <div class="alert-body">
    <div class="alert-title" id="alertTitle"></div>
    <div class="alert-desc" id="alertDesc"></div>
  </div>
  <button class="alert-close" id="alertClose" type="button" aria-label="关闭提示">×</button>
</div>

<!-- 轻提示 -->
<!-- 一键隐藏界面 -->
<button class="ui-toggle" id="uiToggle" type="button" aria-label="隐藏界面">
  <svg class="ico-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
    <line x1="1" y1="1" x2="23" y2="23"/>
  </svg>
  <svg class="ico-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
    <circle cx="12" cy="12" r="3"/>
  </svg>
</button>

<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
